minimum_pre_commit_version: "4.6.2"
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
fail_fast: false

repos:
  - repo: local
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
        entry: uv run --locked trailing-whitespace-fixer
        language: system
        types: [text]

      - id: end-of-file-fixer
        name: Fix end of files
        entry: uv run --locked end-of-file-fixer
        language: system
        types: [text]

      - id: check-yaml
        name: Check YAML
        entry: uv run --locked check-yaml
        language: system
        types: [yaml]

      - id: check-toml
        name: Check TOML
        entry: uv run --locked check-toml
        language: system
        types: [toml]

      - id: check-added-large-files
        name: Check added large files
        entry: uv run --locked check-added-large-files
        language: system

      - id: detect-private-key
        name: Detect private keys
        entry: uv run --locked detect-private-key
        language: system
        types: [text]

      - id: uv-lock
        name: Check uv lockfile
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false

      - id: ruff-format
        name: Check Ruff formatting
        entry: uv run --locked ruff format --check
        language: system
        types: [python]

      - id: ruff-check
        name: Run Ruff lint
        entry: uv run --locked ruff check
        language: system
        types: [python]

      - id: pyright
        name: Run Pyright
        entry: uv run --locked pyright
        language: system
        files: ^(src/|pyproject\.toml$|uv\.lock$)
        pass_filenames: false

      - id: pytest
        name: Run pytest
        entry: uv run --locked pytest -m "not e2e and not live"
        language: system
        files: ^(src/|tests/|pyproject\.toml$|uv\.lock$)
        pass_filenames: false

      - id: djlint
        name: Check Jinja templates
        entry: uv run --locked djlint src/apt_analyzer/web/templates --profile=jinja --check
        language: system
        files: ^src/apt_analyzer/web/templates/.*\.html$
        pass_filenames: false

      - id: frontend-check
        name: Check frontend formatting and lint
        entry: npm run check
        language: system
        files: ^(frontend/|biome\.json$|package(-lock)?\.json$)
        pass_filenames: false

      - id: frontend-typecheck
        name: Type-check frontend
        entry: npm run typecheck
        language: system
        files: ^(frontend/|package(-lock)?\.json$)
        pass_filenames: false

      - id: frontend-unit
        name: Test frontend units
        entry: npm run test
        language: system
        files: ^(frontend/|package(-lock)?\.json$)
        pass_filenames: false

      - id: docs-lint
        name: Lint project docs
        entry: uv run --locked python scripts/docs_lint.py
        language: system
        files: ^(docs/|README\.md$|scripts/docs_lint\.py$)
        pass_filenames: false

      - id: wiki-lint
        name: Lint project wiki
        entry: uv run --locked python scripts/wiki_lint.py
        language: system
        files: ^(wiki/|docs/|scripts/wiki_lint\.py$)
        pass_filenames: false

      - id: commitizen
        name: Check Commitizen message
        entry: uv run --locked cz check --allow-abort --commit-msg-file
        language: system
        stages: [commit-msg]
        always_run: true
