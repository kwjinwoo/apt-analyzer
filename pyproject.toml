[project]
name = "apt-analyzer"
version = "0.1.0"
description = "Analyze apartment transaction liquidity and price resilience."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[project.scripts]
apt-analyzer = "apt_analyzer.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "commitizen>=4.18.0",
    "pre-commit>=4.6.2",
    "pre-commit-hooks>=6.0.0",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = ["D"]
"tests/**/*.py" = ["D"]

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"

[tool.pyright]
include = ["src"]
pythonVersion = "3.14"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["--strict-config", "--strict-markers", "-ra"]
testpaths = ["tests"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
version_provider = "pep621"
tag_format = "v$version"
